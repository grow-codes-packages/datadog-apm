# Service-owned (not generated by sdk-kit): live checks of the Python package against Datadog APM
# (GRO-1385). A real Datadog Agent runs as a job service and forwards the trace the suite sends
# (OTLP) to Datadog; the suite reads it back through the Spans API (live/live_test.py, see
# docs/compatibility.md "Live checks").
#
# Organisation secrets: DATADOG_API_KEY, DATADOG_APP_KEY (apm_read).
# Organisation variable: DATADOG_SITE (default datadoghq.eu).
# Without the two secrets the run ends green with a notice and the live job is skipped (the Agent
# container would not start without an API key).
name: live

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 1" # Mondays 05:27 UTC

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  credentials:
    name: credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the live secrets
        id: check
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          missing=""
          [ -n "$DATADOG_API_KEY" ] || missing="$missing DATADOG_API_KEY"
          [ -n "$DATADOG_APP_KEY" ] || missing="$missing DATADOG_APP_KEY"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live checks skipped::secrets not set:$missing (add them as organisation secrets to run the live checks)"
            echo "Live checks skipped: secrets not set:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  live:
    name: live (python)
    needs: credentials
    if: needs.credentials.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      agent:
        # Same Agent build as the Docker suite (docker/compose.service.yml).
        image: datadog/agent:7.85.4@sha256:d0df2a5f7dcda4f702a1d47ef9bd25bdf772421140ef964537562d906129260a
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_SITE: ${{ vars.DATADOG_SITE || 'datadoghq.eu' }}
          DD_HOSTNAME: grow-sdk-live-ci
          DD_APM_ENABLED: "true"
          DD_APM_NON_LOCAL_TRAFFIC: "true"
          DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
          DD_OTLP_CONFIG_LOGS_ENABLED: "false"
          DD_LOGS_ENABLED: "false"
          DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "false"
          DD_PROCESS_CONFIG_CONTAINER_COLLECTION_ENABLED: "false"
          DD_REMOTE_CONFIGURATION_ENABLED: "false"
          DD_INVENTORIES_ENABLED: "false"
          DD_ENABLE_METADATA_COLLECTION: "false"
          DD_AUTOCONFIG_FROM_ENVIRONMENT: "false"
          DD_LOG_LEVEL: warn
        ports:
          - 8126:8126
          - 4318:4318
        options: >-
          --health-cmd "/opt/datadog-agent/bin/agent/agent health && curl -fsS -o /dev/null http://127.0.0.1:8126/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Lint the live suite
        run: make -C live PYTHON="${{ steps.python.outputs.python-path }}" lint

      - name: Live checks
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          DATADOG_SITE: ${{ vars.DATADOG_SITE || 'datadoghq.eu' }}
          GROW_DATADOG_APM_URL: http://127.0.0.1:8126
          GROW_DATADOG_APM_OTLP_ENDPOINT: http://127.0.0.1:4318
        run: make -C live PYTHON="${{ steps.python.outputs.python-path }}" live

      - name: Agent log
        if: failure()
        run: docker logs --tail 80 "${{ job.services.agent.id }}" 2>&1 || true
